name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # light install: the tests never load torch, transformers or kraken
      - run: pip install -r requirements-ci.txt
      - name: Lint (undefined names, unused imports, syntax errors)
        run: ruff check --select F,E9 src tests
      - name: Tests, with the coverage of every module
        run: python -m pytest -q --cov=src --cov-report=term