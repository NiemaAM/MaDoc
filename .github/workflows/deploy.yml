name: deploy
on:
  push:
    branches: [master]
concurrency: deploy

# On the GPU machine (self-hosted runner DIL2, its user in the docker group): build the image, test it, restart
# the containers. Every image is also tagged with its commit, to roll back without rebuilding (README).
jobs:
  deploy:
    runs-on: [self-hosted, DIL2]
    steps:
      - name: Update the code
        run: |
          cd ~/Documents/MaDoc
          git fetch origin master
          git merge --ff-only origin/master
      - name: Build the image
        run: |
          cd ~/Documents/MaDoc
          docker compose build madoc
          docker tag madoc:latest madoc:$(git rev-parse --short HEAD)
      - name: Tests (in the new image)
        run: cd ~/Documents/MaDoc && docker compose run --rm --no-deps madoc python -m pytest -q
      - name: Start the new version
        run: cd ~/Documents/MaDoc && docker compose up -d --remove-orphans
      - name: Check it answers
        run: curl -fsS --retry 40 --retry-delay 5 --retry-all-errors http://127.0.0.1:7860/ > /dev/null
      - name: Remove the images of old versions (the last 5 are kept)
        run: |
          docker images madoc --format '{{.Tag}} {{.CreatedAt}}' | grep -v '^latest ' | sort -k2 -r | tail -n +6 \
            | cut -d' ' -f1 | xargs -r -I{} docker rmi madoc:{} || true